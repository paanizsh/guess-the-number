version: "3.9"

services:
  host:
    build: ./host
    container_name: game-host
    ports:
      - "8000:8000"
    networks:
      - game-network

  player:
    build: ./player
    container_name: game-player
    ports:
      - "8001:8001"
    depends_on:
      - host
    networks:
      - game-network

networks:
  game-network:
    driver: bridge
